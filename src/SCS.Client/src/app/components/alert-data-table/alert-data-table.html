<p-table [value]="data()" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
        <tr>
            <th>Date</th>
            <th>Message</th>
        </tr>
    </ng-template>
    <ng-template #body let-alert>
        <tr>
            <td>{{ alert.timestamp | date:'short' }}</td>
            <td>{{ alert.message }}</td>
        </tr>
    </ng-template>
</p-table>
