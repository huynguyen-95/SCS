<div class="alarm-simulation-container">
    <h2>Alarm System Simulation</h2>

    <form (ngSubmit)="onSubmit()" #alarmForm="ngForm">
        <div class="form-group">
            <label for="premiseId">Premise Id:</label>
            <input type="number" id="premiseId" name="premiseId" [(ngModel)]="premiseId" required class="form-control">
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" [(ngModel)]="message" required rows="4" class="form-control">
      </textarea>
        </div>

        <button type="submit" [disabled]="!alarmForm.form.valid" class="submit-btn">
            Submit
        </button>
    </form>
</div>
