<div class="incident-simulation-container">
    <h2>Capture Incident Simulation</h2>

    <form (ngSubmit)="onSubmit()" #incidentForm="ngForm">
        <div class="form-group">
            <label for="imageUpload">Upload Image:</label>
            <input type="file" id="imageUpload" name="imageUpload" accept="image/*" (change)="onFileSelected($event)"
                required class="form-control file-input">

            <div class="image-preview" *ngIf="imagePreview">
                <img [src]="imagePreview" alt="Selected image preview" class="preview-image">
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" [(ngModel)]="description" required rows="4"
                placeholder="Describe the incident..." class="form-control">
            </textarea>
        </div>

        <div class="button-group">
            <button type="submit" [disabled]="!incidentForm.form.valid" class="submit-btn">
                Submit
            </button>

            <button type="button" (click)="onReset()" class="reset-btn">
                Reset
            </button>
        </div>
    </form>
</div>
