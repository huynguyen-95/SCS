<div class="layout-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar" [class.collapsed]="!sidebarVisible">
        <div class="sidebar-header">
            <h3>Smart City</h3>
            <button class="toggle-btn" (click)="toggleSidebar()">
                <i class="pi pi-bars"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li>
                    <a routerLink="/home" routerLinkActive="active">
                        <i class="pi pi-home"></i>
                        <span *ngIf="sidebarVisible">Home</span>
                    </a>
                </li>
                <li class="submenu-item">
                    <a (click)="toggleSubmenu('premise')" [class.expanded]="isSubmenuExpanded('premise')">
                        <i class="pi pi-building"></i>
                        <span *ngIf="sidebarVisible">Premise</span>
                        <i *ngIf="sidebarVisible" class="pi pi-chevron-down submenu-arrow"
                            [class.rotate]="isSubmenuExpanded('premise')"></i>
                    </a>
                    <ul class="submenu" *ngIf="isSubmenuExpanded('premise') && sidebarVisible">
                        <li>
                            <a routerLink="/premise/1" routerLinkActive="active">
                                <i class="pi pi-circle-fill"></i>
                                <span>Premise 1</span>
                            </a>
                        </li>
                        <li>
                            <a routerLink="/premise/2" routerLinkActive="active">
                                <i class="pi pi-circle-fill"></i>
                                <span>Premise 2</span>
                            </a>
                        </li>
                        <li>
                            <a routerLink="/premise/3" routerLinkActive="active">
                                <i class="pi pi-circle-fill"></i>
                                <span>Premise 3</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h2>Smart City Surveillance</h2>
            </div>
            <div class="header-right">
                <span>Hi, {{user?.name ?? ''}}</span>
                <button class="user-menu">
                    <i class="pi pi-user"></i>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <main class="content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
